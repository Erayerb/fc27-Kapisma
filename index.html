<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC27 Kapışma</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f9;--panel:#fff;--text:#111827;--mute:#6b7280;--line:#e5e7eb;--a:#2563eb;--b:#ea580c;--ok:#16a34a;--btn:#111827;--btnt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f1a;--panel:#151b2b;--text:#f1f5f9;--mute:#94a3b8;--line:#263148;--btn:#f1f5f9;--btnt:#0b0f1a}}
:root[data-theme="dark"]{--bg:#0b0f1a;--panel:#151b2b;--text:#f1f5f9;--mute:#94a3b8;--line:#263148;--btn:#f1f5f9;--btnt:#0b0f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 8px}
.mute{color:var(--mute);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:240px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
label{font-size:13px;color:var(--mute);display:block;margin:8px 0 3px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--btn);color:var(--btnt)}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.team{border-top:4px solid var(--c)}.team.on{box-shadow:0 0 0 2px var(--c)}
.big{font-size:26px;font-weight:800}
.card{width:130px;border-radius:14px;padding:10px;text-align:center;color:#1b1400;background:linear-gradient(160deg,#f7d56a,#c99a1f);border:2px solid #fff3;margin:auto}
.card.s{background:linear-gradient(160deg,#e5e9ef,#9aa5b5);color:#10151c}.card.br{background:linear-gradient(160deg,#e0a56f,#9a5f2c);color:#1d1005}
.card .o{font-size:34px;font-weight:900;line-height:1}.card .p{font-weight:700;font-size:13px}.card .n{font-size:14px;font-weight:700;margin-top:6px}
.mini{display:inline-flex;gap:6px;align-items:center;padding:4px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:13px;margin:2px}
.bids{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.center{text-align:center}
#log{height:260px;overflow:auto;font-size:14px}
#log div{padding:5px 0;border-bottom:1px solid var(--line)}#log .mt{color:var(--mute)}#log .sys{font-weight:700}
.goal{font-weight:800;color:var(--ok)}
.score{font-size:44px;font-weight:900;text-align:center}
.line{margin:6px 0}.line .l{font-size:11px;color:var(--mute);text-transform:uppercase}
.rules ol{margin:6px 0 0;padding-left:20px;font-size:14px}.rules li{margin:5px 0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ⚠ Oyuncu verileri yaklaşık yer tutucudur; gerçek FC27 değerleriyle değiştirmek için bu listeyi düzenleyin.
const DB=[
["Courtois","GK",89],["Alisson","GK",88],["Donnarumma","GK",88],["Maignan","GK",87],["Ter Stegen","GK",86],["Oblak","GK",86],
["Van Dijk","DEF",89],["Dias","DEF",87],["Saliba","DEF",87],["Rüdiger","DEF",86],["Hakimi","DEF",86],["Alexander-Arnold","DEF",86],
["Bastoni","DEF",86],["Gvardiol","DEF",85],["Theo Hernández","DEF",85],["Cancelo","DEF",85],["Marquinhos","DEF",85],["Ferdi Kadıoğlu","DEF",80],
["Rodri","MID",91],["Bellingham","MID",90],["De Bruyne","MID",89],["Pedri","MID",88],["Valverde","MID",88],["Ødegaard","MID",88],
["Vitinha","MID",87],["Barella","MID",87],["Kimmich","MID",87],["Çalhanoğlu","MID",85],["Arda Güler","MID",82],
["Mbappé","FWD",91],["Haaland","FWD",91],["Vinícius Jr","FWD",90],["Kane","FWD",90],["Yamal","FWD",89],["Salah","FWD",89],
["Dembélé","FWD",88],["Lautaro","FWD",88],["Osimhen","FWD",87],["Saka","FWD",87],["Lewandowski","FWD",86],["Kenan Yıldız","FWD",80]
].map(([n,pos,o])=>({n,pos,o,base:o>=89?20:o>=87?10:5}));
const SIZE=5,MAXOUT=4,MINP=5,COL=["var(--a)","var(--b)"];
const FORMS=["2-1-1","1-2-1","1-1-2","2-0-2","0-2-2","3-0-1","1-0-3"];
const FN={"2-1-1":"Dengeli","1-2-1":"Elmas","1-1-2":"Hücumcu","2-0-2":"Çift kanat","0-2-2":"Ofansif","3-0-1":"Beton savunma","1-0-3":"Tam hücum"};
const IDX={DEF:0,MID:1,FWD:2};
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},timer=null;

function cardHtml(p){const c=p.o>=88?'':p.o>=84?'s':'br';
return `<div class="card ${c}"><div class="o">${p.o}</div><div class="p">${p.pos}</div><div class="n">${e(p.n)}</div></div>`}
const mini=p=>`<span class="mini"><b>${p.o}</b>${p.pos} ${e(p.n)} <span class="mute">${p.paid}M</span></span>`;

/* ---------- Giriş ---------- */
function setup(){
clearInterval(timer);
$('#app').innerHTML=`<h1>⚽ FC27 Kapışma</h1><p class="mute">İki takım, bütçe, açık artırma ve final maçı. Aynı cihazda sırayla oynanır.</p>
<div class="panel rules" style="margin-bottom:12px"><h2>📜 Oyun Kuralları</h2><ol>
<li><b>Kadro:</b> Her takım tam <b>5 oyuncu</b> almak zorundadır: <b>1 kaleci (zorunlu)</b> + 4 saha oyuncusu. Saha oyuncularının mevkisi serbesttir (hepsi forvet de olabilir).</li>
<li><b>Sırayla açılış:</b> Oyuncular tek tek açılır, açılış sırası takımlar arasında dönüşümlüdür. Oyuncuyu açan takım <b>teklif vermek zorundadır</b> (en az başlangıç fiyatı), pas geçemez.</li>
<li><b>Karşı hamle:</b> Sıra rakibe geçince rakip teklifi <b>artırabilir ya da pas geçebilir</b>. Pas geçen taraf oyuncuyu kaybeder; oyuncu son teklifi verene gider. Oyuncu satılmadan kalmaz.</li>
<li><b>Bütçe ve fiyatlar:</b> Varsayılan bütçe 100M. Başlangıç fiyatları: güçlü oyuncular 20M, ortalama oyuncular 10M, diğerleri 5M. Teklifler +1 / +2 / +5 / +10 adımlarıyla artar. Boş slot kalmaması için kalan her slota en az 5M (kaleciniz yoksa en ucuz kaleci fiyatı) rezerv ayrılır, bu rezervi aşan teklif veremezsiniz. Kaleciniz varsa başka kaleciye, saha kadronuz dolduysa saha oyuncusuna teklif veremezsiniz. Yine de boş slot kalırsa açık artırma sırayla baştan yapılır.</li>
<li><b>Formasyon:</b> Açık artırma bitince her takım formasyonunu seçer (DEF-OS-FWD). Oyuncular en uygun hatta otomatik yerleşir. Mevkisi dışında oynayan oyuncunun gücü düşer (komşu hat -5, uzak hat -10).</li>
<li><b>Maç:</b> Kadro ve formasyon gücüne göre dakika dakika 90 dakikalık simülasyon oynanır (devre arası dahil, istersen atlayabilirsin). Beraberlikte seri penaltı atışları yapılır.</li></ol></div>
<div class="row">
<div class="panel team" style="--c:${COL[0]}"><h2>Takım 1</h2><label>Takım adı</label><input id="n0" value="Kırmızı Şimşekler" maxlength="20"></div>
<div class="panel team" style="--c:${COL[1]}"><h2>Takım 2</h2><label>Takım adı</label><input id="n1" value="Mavi Fırtına" maxlength="20"></div>
</div>
<div class="panel" style="margin-top:12px"><label>Başlangıç bütçesi (milyon)</label><input id="bud" type="number" value="100" min="30" max="1000">
<p class="mute">Başlangıç fiyatları: güçlü oyuncular 20M, ortalama oyuncular 10M, diğerleri 5M.</p>
<button onclick="start()">Açık Artırmayı Başlat</button></div>`}

function start(){
const b=Math.max(30,+$('#bud').value||100);
S={B:b,names:[$('#n0').value.trim()||'Takım 1',$('#n1').value.trim()||'Takım 2'],bud:[b,b],sq:[[],[]],
queue:DB.map(x=>({...x})).sort(()=>Math.random()-.5),nom:Math.floor(Math.random()*2),cur:null,msg:'',form:['2-1-1','2-1-1']};
next()}

/* ---------- Açık artırma ---------- */
const left=t=>SIZE-S.sq[t].length;
function need(t,pos){return pos==='GK'?!S.sq[t].some(p=>p.pos==='GK'):S.sq[t].filter(p=>p.pos!=='GK').length<MAXOUT}
function reserveFor(t,p){const r=left(t)-1,hasGK=S.sq[t].some(x=>x.pos==='GK')||p.pos==='GK';
if(r<=0)return 0;if(hasGK)return r*MINP;
const g=S.queue.filter(x=>x.pos==='GK').map(x=>x.base);return (g.length?Math.min(...g):99)+(r-1)*MINP}
function canBid(t,amt,p){p=p||S.cur.p;return need(t,p.pos)&&amt<=S.bud[t]-reserveFor(t,p)}
function amts(){const c=S.cur;return c.bid?[c.bid+1,c.bid+2,c.bid+5,c.bid+10]:[c.p.base,c.p.base+2,c.p.base+5,c.p.base+10]}

function next(){
if(left(0)===0&&left(1)===0)return finish();
for(const o of [S.nom,1-S.nom]){
const i=S.queue.findIndex(p=>need(o,p.pos)&&canBid(o,p.base,p));
if(i>=0){const p=S.queue.splice(i,1)[0];S.cur={p,bid:0,leader:null,turn:o,opener:o};S.nom=1-o;return render()}}
finish()}

function bid(amt){const c=S.cur,t=c.turn;if(!canBid(t,amt))return;
c.bid=amt;c.leader=t;c.turn=1-t;S.msg=`${S.names[t]} ${amt}M teklif verdi`;
if(!canBid(c.turn,amts()[0])){S.msg+=` · ${S.names[c.turn]} artıramıyor`;return win(c.leader)}
render()}
function pass(){const c=S.cur;if(c.leader===null)return;win(c.leader)}
function win(t){const c=S.cur;S.bud[t]-=c.bid;S.sq[t].push({...c.p,paid:c.bid});
S.msg=`✅ ${c.p.n} → ${S.names[t]} (${c.bid}M)`;next()}

function squadHtml(t){return S.sq[t].map(mini).join('')||'<span class="mute">Henüz oyuncu yok</span>'}
function teamPanel(t){const on=S.cur&&S.cur.turn===t,gk=S.sq[t].some(p=>p.pos==='GK');
return `<div class="panel team ${on?'on':''}" style="--c:${COL[t]}"><div class="bar"><h2>${e(S.names[t])}</h2><span class="mute">${S.sq[t].length}/${SIZE}<span class="tag">KL ${gk?'✓':'gerekli'}</span></span></div>
<div class="big">${S.bud[t]}M</div>${squadHtml(t)}</div>`}

function render(){
const c=S.cur,t=c.turn,forced=c.leader===null,mx=Math.max(0,S.bud[t]-reserveFor(t,c.p));
const btns=amts().map(a=>`<button ${canBid(t,a)?'':'disabled'} onclick="bid(${a})">${a}M</button>`).join('');
$('#app').innerHTML=`<div class="bar"><h1>⚽ Açık Artırma</h1><span class="mute">Kalan oyuncu: ${S.queue.length}</span></div>
<div class="panel center"><div class="mute">${e(S.msg||'Yeni oyuncu açıldı')}</div>${cardHtml(c.p)}
<p style="margin:10px 0 0">Başlangıç: <b>${c.p.base}M</b> · Güncel teklif: <b>${c.bid?c.bid+'M':'—'}</b>${c.leader!==null?` (${e(S.names[c.leader])})`:''}</p>
<p style="color:${COL[t]};font-weight:700;margin:6px 0 0">Sıra: ${e(S.names[t])}</p>
<p class="mute" style="margin:0">${forced?'Açılış teklifi zorunlu, pas geçilemez.':'Teklifi artırabilir ya da pas geçebilirsin.'} En fazla teklif: <b>${mx}M</b></p>
<div class="bids">${btns}<button class="ghost" ${forced?'disabled':''} onclick="pass()">Pas</button></div></div>
<div class="row" style="margin-top:12px">${teamPanel(0)}${teamPanel(1)}</div>`}

/* ---------- Formasyon ---------- */
function perms(a){if(a.length<2)return[a];const r=[];a.forEach((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).forEach(p=>r.push([x,...p])));return r}
function lineup(t){
const [d,m,f]=S.form[t].split('-').map(Number);
const slots=[...Array(d).fill('DEF'),...Array(m).fill('MID'),...Array(f).fill('FWD')];
const out=S.sq[t].filter(p=>p.pos!=='GK');
while(out.length<slots.length)out.push({n:'Boş slot',pos:'MID',o:40,paid:0});
const gk=S.sq[t].find(p=>p.pos==='GK')||{n:'Boş kaleci',pos:'GK',o:40,paid:0};
const eff=(p,s)=>p.o-5*Math.abs(IDX[p.pos]-IDX[s]);
let best=null,bs=-1e9;
perms(out).forEach(pm=>{const sc=pm.reduce((s,p,i)=>s+eff(p,slots[i]),0);if(sc>bs){bs=sc;best=pm}});
return [{p:gk,slot:'GK',eff:gk.o},...best.map((p,i)=>({p,slot:slots[i],eff:eff(p,slots[i])}))]}
const av=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
function wavg(pairs){let s=0,w=0;pairs.forEach(([v,k])=>{if(v!==null){s+=v*k;w+=k}});return s/w}
function strength(L){const g=s=>av(L.filter(x=>x.slot===s).map(x=>x.eff));
const D=g('DEF'),M=g('MID'),F=g('FWD'),G=g('GK');
return{atk:wavg([[F,3],[M,2],[D,.5]]),def:wavg([[D,3],[G,2],[M,1]])}}
const power=L=>{const s=strength(L);return Math.round((s.atk+s.def)/2)};
function lineHtml(L){return ['FWD','MID','DEF','GK'].map(s=>{const a=L.filter(x=>x.slot===s);
return a.length?`<div class="line"><div class="l">${s}</div>${a.map(x=>`<span class="mini"><b>${x.eff}</b> ${e(x.p.n)}${x.eff<x.p.o?` <span class="mute">(${x.p.pos}→${s})</span>`:''}</span>`).join('')}</div>`:''}).join('')}

function finish(){
if(left(0)>0||left(1)>0){S.sq=[[],[]];S.bud=[S.B,S.B];S.queue=DB.map(x=>({...x})).sort(()=>Math.random()-.5);
S.msg='⚠ Boş slot kaldı, açık artırma sırayla baştan yapılıyor.';return next()}
S.cur=null;lineupPage()}
function setForm(t,v){S.form[t]=v;lineupPage()}
function lineupPage(){
const pn=t=>{const L=lineup(t);return `<div class="panel team" style="--c:${COL[t]}"><div class="bar"><h2>${e(S.names[t])}</h2><span class="mute">Kalan bütçe: ${S.bud[t]}M</span></div>
<label>Formasyon (DEF-OS-FWD)</label><select onchange="setForm(${t},this.value)">${FORMS.map(f=>`<option value="${f}" ${S.form[t]===f?'selected':''}>${f} · ${FN[f]}</option>`).join('')}</select>
${lineHtml(L)}<p class="mute" style="margin:8px 0 0">Takım gücü: <b>${power(L)}</b></p></div>`};
$('#app').innerHTML=`<h1>Formasyon Seç</h1><p class="mute">Açık artırma bitti. Formasyonu değiştirdikçe oyuncular en uygun hatta yeniden dizilir.</p>
<div class="row">${pn(0)}${pn(1)}</div>
<div class="panel" style="margin-top:12px;text-align:center"><button onclick="play()">⚔ Maçı Başlat</button> <button class="ghost" onclick="setup()">Yeniden Kur</button></div>`}

/* ---------- Maç ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function scorer(t){const w=S.L[t].map(x=>({p:x.p,w:({FWD:5,MID:3,DEF:1,GK:0})[x.slot]*(x.eff/80)}));
let r=Math.random()*w.reduce((s,x)=>s+x.w,0);for(const x of w){r-=x.w;if(r<=0)return x.p}return w[1].p}

function simulate(){
const st=[strength(S.L[0]),strength(S.L[1])],T=[],g=[0,0];
const add=(m,txt,o)=>T.push({m,txt,g:[...g],...(o||{})});
add("0'",`🔔 Hakem düdüğü çaldı! ${S.names[0]} (${S.form[0]}) - ${S.names[1]} (${S.form[1]})`,{sys:1});
for(let m=4;m<=88;m+=4){
const pa=st[0].atk/(st[0].atk+st[1].atk),t=Math.random()<pa?0:1,o=1-t,p=scorer(t),n=S.names[t];
add(m+"'",pick([`${n} orta sahada topu çeviriyor.`,`${p.n} topu ileri taşıyor.`,`Kanattan bir orta geliyor...`,`${n} baskıyı artırdı.`,`${p.n} savunmayı geçmeye çalışıyor.`]),{mute:1});
const pg=Math.min(.35,Math.max(.03,.14+(st[t].atk-st[o].def)*.008));
if(Math.random()<pg){g[t]++;add(m+"'",`⚽ GOL! ${p.n} (${n}) ağlara gönderdi!`,{goal:1})}
else{const dd=pick(S.L[o].slice(1)).p.n;
add(m+"'",pick([`${p.n} şut çekti, ${S.L[o][0].p.n} son anda çıkardı!`,`${p.n} vuruşu auta gitti.`,`${p.n}'in şutu direkten döndü!`,`${dd} son anda araya girdi, tehlike geçti.`,`Korner kazandı ${n}, ama atak sonuçsuz kaldı.`,`🟨 ${dd} sert müdahale yaptı, sarı kart gördü.`]))}
if(m===44)add("45'","⏸ Devre arası. Takımlar soyunma odasına gidiyor.",{sys:1})}
add("90'","🏁 Hakem final düdüğünü çaldı.",{sys:1});
let pen=null;
if(g[0]===g[1]){
add("90'","🥅 Beraberlik! Seri penaltı atışlarına geçiliyor.",{sys:1});
const sc=[0,0];let i=0,done=false;
while(!done){
for(const t of [0,1]){const ks=S.L[t].slice(1),p=ks[i%ks.length],ok=Math.random()<.76;if(ok)sc[t]++;
add("PEN",`${p.n} (${S.names[t]}) penaltıyı ${ok?'gole çevirdi ✅':'kaçırdı ❌'} · ${sc[0]}-${sc[1]}`,{pen:[...sc]})}
i++;if(i>=5&&sc[0]!==sc[1])done=true;
if(i>=15){if(sc[0]===sc[1])sc[0]++;done=true}}
pen=sc}
return{T,g:[...g],pen}}

function play(){
S.L=[lineup(0),lineup(1)];
const r=simulate();let i=0;
$('#app').innerHTML=`<h1>Maç</h1>
<div class="panel"><div class="bar"><b style="color:${COL[0]}">${e(S.names[0])} <span class="mute">${S.form[0]}</span></b><b style="color:${COL[1]}">${e(S.names[1])} <span class="mute">${S.form[1]}</span></b></div>
<div class="score"><span id="s0">0</span> - <span id="s1">0</span></div><div class="center mute" id="min">0'</div></div>
<div class="panel" style="margin-top:12px"><div id="log"></div></div>
<div class="center" style="margin-top:10px"><button class="ghost" id="skip">⏭ Atla</button></div>
<div id="end"></div>`;
const log=$('#log');
const step=()=>{
if(i>=r.T.length){clearInterval(timer);fin(r);return false}
const x=r.T[i++];
$('#min').textContent=x.pen?`Penaltılar ${x.pen[0]}-${x.pen[1]}`:x.m;
$('#s0').textContent=x.g[0];$('#s1').textContent=x.g[1];
log.insertAdjacentHTML('beforeend',`<div class="${x.goal?'goal':''}${x.mute?' mt':''}${x.sys?' sys':''}">${x.pen?'':x.m+' — '}${e(x.txt)}</div>`);log.scrollTop=log.scrollHeight;return true};
timer=setInterval(step,750);
$('#skip').onclick=()=>{clearInterval(timer);while(step());}}

function fin(r){
const sk=$('#skip');if(sk)sk.remove();
let w=r.g[0]>r.g[1]?0:r.g[1]>r.g[0]?1:null,txt='';
if(w===null){w=r.pen[0]>r.pen[1]?0:1;txt=` · Penaltılar: ${r.pen[0]}-${r.pen[1]}`}
$('#log').insertAdjacentHTML('beforeend',`<div><b>Final skoru ${r.g[0]}-${r.g[1]}${txt}</b></div>`);
$('#log').scrollTop=1e5;
